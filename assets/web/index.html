<!doctype html>
<html lang="zh-CN" data-ui-language="__WB_UI_LANGUAGE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1ede3">
<meta name="referrer" content="no-referrer">
<title>WorkBuddy Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23b04a28'/%3E%3Cpath d='M17.5 5 8 18h7l-1 9 9.500-13h-7l1-9Z' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* Runs before first paint so the saved theme never flashes. Storage keys are
   the same ones the previous dashboard used. */
(function () {
  var r = document.documentElement, mode = 'system', style = 'claude';
  try {
    mode = localStorage.getItem('wb-theme') || 'system';
    style = localStorage.getItem('wb-theme-style') || 'claude';
  } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') {
    mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  if (style !== 'claude' && style !== 'material' && style !== 'miuix') style = 'claude';
  r.setAttribute('data-theme', mode);
  r.setAttribute('data-theme-style', style);
})();
</script>
<link rel="stylesheet" href="/ui/app.css">
<link rel="modulepreload" href="/ui/js/main.js">
</head>
<body>
<div id="root">
  <div style="height:100%;display:grid;place-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--fg-3);font-size:13px">
      <div class="brand-logo" style="width:44px;height:44px;border-radius:13px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.500 4.500 13.500H12L11 21.500l8.500-11H12l1-8Z"/></svg>
      </div>
      <div class="spinner"></div>
    </div>
  </div>
</div>
<noscript><div style="padding:24px;font:14px system-ui">This dashboard needs JavaScript.</div></noscript>
<script type="module" src="/ui/js/main.js"></script>
</body>
</html>
