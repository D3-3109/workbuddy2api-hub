# WorkBuddy2API Rust gateway, using the image published by GitHub Actions.
#
#   cp .env.example .env      # fill in API_KEY and WB_PANEL_PASSWORD
#   chmod 600 .env
#   docker compose up -d
#
# Panel: http://127.0.0.1:8788/    API: http://127.0.0.1:8788/v1
# Data lives in the named volumes below; back them up before upgrading.
services:
  wb2api:
    image: ${WB_IMAGE:-ghcr.io/d3-3109/workbuddy2api-hub-rust:edge}
    container_name: wb2api
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      WB_PANEL_PASSWORD: ${WB_PANEL_PASSWORD:?set WB_PANEL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # Loopback by default. Put a TLS reverse proxy in front, or set
      # WB_BIND_ADDRESS=0.0.0.0 only if you accept exposing the panel directly.
      - "${WB_BIND_ADDRESS:-127.0.0.1}:${WB_PORT:-8788}:8788"
    volumes:
      - wb2api-accounts:/data/accounts
      - wb2api-usage:/data/usage
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wb2api-accounts:
  wb2api-usage:
